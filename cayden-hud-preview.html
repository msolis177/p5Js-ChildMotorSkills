<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cayden's HUD Prototype</title>

    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7e7bd;
        font-family: "Trebuchet MS", sans-serif;
      }

      main {
        padding: 24px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        color: #59433a;
        font-size: 24px;
      }

      #hud-preview canvas {
        display: block;
        max-width: 100%;
        height: auto !important;
        border: 5px solid #7b584b;
        border-radius: 24px;
        box-shadow: 0 10px 24px rgba(89, 67, 58, 0.2);
      }

      p {
        margin: 12px 0 0;
        color: #6e554a;
        font-size: 15px;
      }
    </style>

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
  </head>

  <body>
    <main>
      <h1>Cayden's Shared HUD Prototype</h1>
      <div id="hud-preview"></div>
      <p>Use Home, Sound, Try Again, and Next to test the shared controls.</p>
    </main>

    <script src="games/Feed The Dragon/feedTheDragon.js"></script>
    <script src="hud/hankFinishScreen.js"></script>
    <script src="hud/caydenHUD.js"></script>
  </body>
</html>
