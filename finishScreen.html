<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dragon's Birthday Party</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      background: #f7e7bd;
    }

    main {
      width: min(100%, 970px);
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      box-sizing: border-box;
      border: 5px solid #7b584b;
      border-radius: 24px;
      box-shadow: 0 10px 24px rgba(89, 67, 58, 0.2);
    }
  </style>

  <script src="libraries/p5.min.js"></script>
</head>

<body>
  <main id="finish-page"></main>

  <script src="hud/hankFinishScreen.js"></script>

  <script>
    function setup() {
      const canvas = createCanvas(960, 640);
      canvas.parent("finish-page");
      textFont("Trebuchet MS");
    }

    function draw() {
      drawHankFinishScreen();
    }

    function mousePressed() {
      hankFinishMousePressed();
    }

    // Keep the same button appearance as the existing screen.
    function drawHudButton(button, label, buttonColor) {
      const hovering = isInsideHudButton(mouseX, mouseY, button);

      push();
      stroke("#7B584B");
      strokeWeight(3);
      fill(hovering ? "#FFF08A" : buttonColor);
      rect(button.x, button.y, button.width, button.height, 18);

      noStroke();
      fill("#513B33");
      textAlign(CENTER, CENTER);
      textStyle(BOLD);
      textSize(17);
      text(
        label,
        button.x + button.width / 2,
        button.y + button.height / 2
      );
      pop();
    }

    function isInsideHudButton(x, y, button) {
      return (
        x >= button.x &&
        x <= button.x + button.width &&
        y >= button.y &&
        y <= button.y + button.height
      );
    }
  </script>
</body>
</html>
