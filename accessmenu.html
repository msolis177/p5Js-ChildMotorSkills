<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a Game</title>
    <link rel="stylesheet" href="style2.css" />
    <script src="Global.js"></script>
  </head>

  <script>
   document.addEventListener("DOMContentLoaded", function () {

    const games = [
        {
            name: "balloons",
            label: "Balloon Game"
        },
        {
            name: "pouring",
            label: "Pouring Game"
        },
        {
            name: "feedMe",
            label: "Feed Me Game"
        },
        {
            name: "bubbles",
            label: "Bubbles Game"
        }
    ];

     games.forEach(game => {
        const gameTile = document.querySelector(
            `[aria-label="${game.label}"]`
        );

        if (gameTile && localStorage.getItem(`tinyTots.${game.name}Complete`) === "true") {
            gameTile.style.position = "relative";

            const checkmark = document.createElement("span");
            checkmark.textContent = "✓";
            checkmark.style.cssText = `
                position: absolute;
                top: 8px;
                right: 8px;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: #569d38;
                color: white;
                font-size: 30px;
                line-height: 40px;
                text-align: center;
                pointer-events: none;
            `;

            gameTile.appendChild(checkmark);
            gameTile.setAttribute("aria-label", game.label + " completed");
        }
    });

    const allGamesCompleted = games.every(game =>
        localStorage.getItem(`tinyTots.${game.name}Complete`) === "true"
    );

    if (allGamesCompleted) {
        window.location.href = "finishScreen.html";
    }
});
</script>
  <body>
    <main class="playroom-frame">
      <button class="back-button" onclick="history.back()">Back</button>

      <h1>Choose a Game</h1>

      <div class="container">
        <div class="game-grid">
          <button class="game-card" aria-label="Balloon Game" onclick="window.location.href='games/Balloon%20Pump/balloonPump.html';">
            <span class="game-picture">&#127880;</span>
          </button>

          <button class="game-card" aria-label="Pouring Game" onclick="window.location.href=''">
            <span class="game-picture">&#129751;</span>
          </button>

          <button class="game-card" aria-label="Feed Me Game" onclick="window.location.href='cayden-hud-preview.html?game=dragon';">
            <span class="game-picture">&#129348;</span>
          </button>

          <button class="game-card" aria-label="Bubbles Game" onclick="window.location.href='/games/Bubbles/bubbles.html';">
            <span class="game-picture">🫧</span>
          </button>
        </div>
      </div>
    </main>

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
  </body>
</html>
