<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose a Game</title>
    <link rel="stylesheet" href="style2.css" />
  </head>

  <body>
    <main class="playroom-frame">
      <button class="back-button" onclick="history.back()">Back</button>

      <h1>Choose a Game</h1>

      <div class="container">
        <div class="game-grid">
          <button class="game-card" aria-label="Balloon Game" onclick="window.location.href='';">
            <span class="game-picture">&#127880;</span>
          </button>

          <button class="game-card" aria-label="Pouring Game onclick="window.location.href='accessmenu.html';"">
            <span class="game-picture">&#129751;</span>
          </button>

          <button class="game-card" aria-label="Feed Me Game" onclick="window.location.href='cayden-hud-preview.html?game=dragon';">
            <span class="game-picture">&#129348;</span>
          </button>

          <button class="game-card" aria-label="Bubbles Game onclick="window.location.href='accessmenu.html';"">
            <span class="game-picture">🫧</span>
          </button>
        </div>
      </div>
    </main>

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
  </body>
</html>
