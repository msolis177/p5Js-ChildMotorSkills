<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pump It Up!</title>
  <script src="../../Global.js"></script>
  <link rel="stylesheet" href="../../style.css">

  <style>
    #balloon-frame {
      position: relative;
      padding: 0;
      gap: 0;
    }

    #balloon-frame canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
      border: none;
    }
    .home-button {
      position: absolute;
      z-index: 2;
      top: 24px;
      left: 24px;
      width: 126px;
      height: 52px;
      min-height: 52px;
      padding: 0;
      border: 3px solid #7b584b;
      border-radius: 18px;
      background: #ffd45a;
      color: #513b33;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      
    }
    .home-button:hover {
      background: #fff08a;
    }
  .progress-bar {
  position: absolute;
  z-index: 1;
  top: 17%;
  left: 50%;
  transform: translateX(-50%);
  width: 42%;
  max-width: 400px;
  height: 20px;
  border: 2px solid #7b584b;
  border-radius: 10px;
  background: #eef2f3;
  pointer-events: none;
}
  </style>
</head>
<body>
  <main class="playroom-frame" id="balloon-frame">
  <button class="home-button" onclick="window.location.href='../../accessmenu.html';">HOME</button>
  <button class="home-button" id="sound-toggle" type="button"
        style="left: auto; right: 24px;" aria-label="Mute music">
  <span aria-hidden="true">🔊</span>
</button>
  <div class="progress-bar"></div>
</main>

  <script src="../../libraries/p5.min.js"></script>
  <script src="../../libraries/p5.sound.min.js"></script>
  <script src="balloon.js"></script>
</body>
</html>
