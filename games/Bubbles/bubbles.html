<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch</title>
    <link rel="stylesheet" type="text/css" href="bubbles.css">
    <script src="../../libraries/p5.min.js"></script>
    <script src="../../libraries/p5.sound.min.js"></script>
    <script src="../../Global.js"></script>
  </head>
  
  <body>
    <main class="playroom-frame">
    <div class="outside-button">
      <button id="home-button" onclick="window.location.href='../../accessmenu.html';">HOME</button>
    </div>

    <header class="game-header">
        <h1>BUBBLES</h1>
    </header>

    <section id="selection-screen" class="screen">
      <h2>Choose your bubble wand!</h2>
        <div class="wand-choices">
           <button class="wand-card" data-wand="0">
              <img src="../../assets/images/PinkBubbleWand.png" alt="Pink bubble wand" class="wand-image">
           </button>
  
          <button class="wand-card" data-wand="1">
                <img src="../../assets/images/BlueBubbleWand.png" alt="Blue bubble wand" class="wand-image">
          </button>
  
          <button class="wand-card" data-wand="2">
                <img src="../../assets/images/PurpleBubbleWand.png" alt="Purple bubble wand" class="wand-image">
           </button>
        </div>
    </section>

    <section id="game-screen" class="screen">
      <div id="bubble-container">
        <img id="selected-wand-image" class="selected-wand-image" src="" alt="Selected bubble wand">
        
        <div class="game-buttons">

           <div class="score-box">
              <strong id="score">0</strong>
              <span>/ 4</span>
          </div>

          <div class="bubble-tally">
            <span class="tally-bubble"></span>
            <span class="tally-bubble"></span>
            <span class="tally-bubble"></span>
            <span class="tally-bubble"></span>
           </div>

        </div>
      </div>

      <p id="message"> Trace the circle to blow a bubble!</p>
      <button id="try-again-button" onclick="resetGame()">TRY AGAIN</button>
      <button id="next-button">NEXT</button>

    </section>
    </main>

    <script src="bubbles.js"></script>
  </body>
</html>
