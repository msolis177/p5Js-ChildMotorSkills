<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Tots Playroom</title>
    <link rel="stylesheet" href="style.css" />

    <script src="libraries/p5.min.js"></script>
    <script src="libraries/p5.sound.min.js"></script>
    <script src="Global.js"></script>
</head>
  <body>
    <main class="playroom-frame">
      <div class="text-cont">
        <h1>Tiny Tots Playroom</h1>
      </div>
      <div class="container">
        <button onclick="startNewRound()">

          START
        </button>
      </div>
    </main>
    <script>
  function startNewRound() {
    ["balloons", "pouring", "feedMe", "bubbles"].forEach(function (game) {
      localStorage.removeItem("tinyTots." + game + "Complete");
    });

    window.location.href = "accessmenu.html";
  }
</script>
  </body>
</html>
